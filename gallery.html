    /* ---- nav fits four links on phones ---- */
    @media (max-width: 760px) {
      .nav { gap: 12px; }
      .nav a { font-size: 11px; letter-spacing: 0.04em; }
      .brand .logo { --h: 26px; }

    @media (max-width: 380px) {
      .site-header .inner { flex-wrap: wrap; row-gap: 2px; }

    /* ---- gallery ---- */
    .gallery-grid { columns: 3 280px; column-gap: 14px; }
    .gallery-item { margin: 0 0 14px; break-inside: avoid; background: #e9e7e2; line-height: 0; }
    .gallery-item button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .gallery-item img { width: 100%; height: auto; display: block; transition: opacity 0.2s ease; }
    .gallery-item button:hover img { opacity: 0.88; }
    .gallery-item button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .gallery-empty { margin: 0; color: var(--ink-soft); }
    @media (max-width: 560px) { .gallery-grid { columns: 2 140px; column-gap: 10px; } .gallery-item { margin-bottom: 10px; } }

    /* ---- photo viewer ---- */
    .lb { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(13, 13, 13, 0.93); }
    .lb.open { display: flex; }
    .lb img { max-width: 92vw; max-height: 86vh; width: auto; height: auto; object-fit: contain; display: block; }
    .lb button { position: absolute; border: 0; background: transparent; color: #ece4d3; cursor: pointer; font-family: var(--font-body); line-height: 1; padding: 14px; }
    .lb button:focus-visible { outline: 2px solid #ece4d3; outline-offset: 2px; }
    .lb-close { top: 8px; right: 8px; font-size: 34px; }
    .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); font-size: 40px; }
    .lb-prev { left: 4px; }
    .lb-next { right: 4px; }
    .lb-count { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ece4d3; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; }

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---- photos ----
       Add one line per photo: { src: "file-name.jpg", alt: "short description" },
       in the order you want them shown. Upload the photo files next to this page. */
    var PHOTOS = [
      { src: "gallery-1.jpg", alt: "Wearing the navy Wreck hoodie, back view, looking out over the city" },
      { src: "gallery-2.jpg", alt: "Wearing the navy Wreck hoodie, front view, hands on the hood" }
    ];

    (function () {
      var grid = document.getElementById("gallery");
      var empty = document.getElementById("gallery-empty");
      var lb = document.getElementById("lb");
      var lbImg = document.getElementById("lb-img");
      var lbCount = document.getElementById("lb-count");
      var current = 0;
      var lastFocus = null;

      if (!PHOTOS.length) { empty.hidden = false; }

      PHOTOS.forEach(function (p, i) {
        var fig = document.createElement("figure");
        fig.className = "gallery-item";
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Open photo " + (i + 1) + (p.alt ? ": " + p.alt : ""));
        var im = document.createElement("img");
        im.src = p.src;
        im.alt = p.alt || "";
        im.loading = i < 6 ? "eager" : "lazy";
        b.appendChild(im);
        fig.appendChild(b);
        grid.appendChild(fig);
        b.addEventListener("click", function () { open(i); });
      });

      function show(i) {
        current = (i + PHOTOS.length) % PHOTOS.length;
        lbImg.src = PHOTOS[current].src;
        lbImg.alt = PHOTOS[current].alt || "";
        lbCount.textContent = (current + 1) + " / " + PHOTOS.length;
      }
      function open(i) {
        lastFocus = document.activeElement;
        show(i);
        lb.classList.add("open");
        document.body.style.overflow = "hidden";
        document.getElementById("lb-close").focus();
      }
      function close() {
        lb.classList.remove("open");
        document.body.style.overflow = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      document.getElementById("lb-close").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function () { show(current - 1); });
      document.getElementById("lb-next").addEventListener("click", function () { show(current + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft") show(current - 1);
        else if (e.key === "ArrowRight") show(current + 1);
      });
    })();
  </script>
